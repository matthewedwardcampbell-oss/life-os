<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Penultimate</title>
<style>
  :root{--bg:#0f1226;--panel:#1a1f3d;--p2:#161b38;--ink:#e8e9f5;--mut:#9aa0c8;--line:#2a3157;
    --pur:#8a6fd4;--teal:#84b8ca;--grn:#7ac9a0;--org:#e9a95c;--vio:#a487da;--white:#eef1ff;
    color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(130% 80% at 50% 0,#1b2048,var(--bg));color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 30px max(16px,env(safe-area-inset-left));
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto}
  a.back{color:var(--teal);font-size:.8rem;text-decoration:none}
  h1{font-weight:650;font-size:1.5rem;margin:.3rem 0 0}
  .sub{color:var(--mut);font-size:.82rem;margin:2px 0 0}
  .well{position:relative;width:min(56vw,210px);aspect-ratio:1;margin:16px auto 4px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    border:2px solid var(--vio);background:radial-gradient(circle at 50% 36%,#3a4080,#1b2048 70%);
    box-shadow:0 0 44px rgba(138,111,212,.3),inset 0 0 30px rgba(238,241,255,.08)}
  .well .bal{font-size:clamp(2.1rem,10vw,3rem);font-weight:750;color:var(--white);line-height:1}
  .well .lbl{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-top:4px}
  .well .mec{font-size:.58rem;letter-spacing:.14em;color:var(--vio);margin-top:6px}
  .sect{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:14px}
  .sect h2{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:650}
  .track{margin:0 0 12px}
  .track:last-child{margin-bottom:0}
  .track h3{font-size:.96rem;margin:0 0 6px;font-weight:650;color:var(--ink)}
  .track h3 .q{font-size:.7rem;color:var(--mut);font-weight:500}
  .step{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;border-top:1px solid var(--line)}
  .step:first-of-type{border-top:0}
  .box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:13px;color:var(--grn)}
  .step[data-done="1"] .box{border-color:var(--grn);background:rgba(122,201,160,.14)}
  .step[data-done="1"] .t{color:var(--mut);text-decoration:line-through}
  .step .t{flex:1;font-size:.9rem}
  .step .r{font-size:.72rem;color:var(--vio)}
  .reward,.mile{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .reward:first-of-type,.mile:first-of-type{border-top:0}
  .reward .t,.mile .t{flex:1;font-size:.9rem}
  .mile .t small{display:block;color:var(--mut);font-size:.72rem}
  .cost{font-size:.76rem;color:var(--mut);margin-right:2px}
  button.act{appearance:none;border:1px solid var(--vio);background:transparent;color:var(--vio);
    font:inherit;font-size:.8rem;font-weight:600;padding:.4rem .8rem;border-radius:99px;cursor:pointer;white-space:nowrap}
  button.act:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--mut)}
  button.act.on{background:rgba(122,201,160,.14);border-color:var(--grn);color:var(--grn)}
  .foot{color:var(--mut);font-size:.74rem;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="paracosm.html">‹ Paracosm</a>
  <h1>The Penultimate</h1>
  <p class="sub">Behind the Looking Glass — the seat of the True Power: the 37th and the Progenitor.</p>

  <div class="well">
    <div class="bal" id="bal">0</div>
    <div class="lbl">White Matter · Saidar</div>
    <div class="mec">MEC III · the 37th</div>
  </div>

  <div class="sect">
    <h2>Side Quests</h2>
    <div id="quests"></div>
  </div>

  <div class="sect">
    <h2>The Will Store</h2>
    <div id="rewards"></div>
  </div>

  <div class="sect">
    <h2>Milestones</h2>
    <div id="miles"></div>
  </div>

  <p class="foot">Earn by keeping your word · spend on what's earned · the honor system is yours to keep.</p>
</div>

<script src="wm.js"></script>
<script>
  var QUESTS = [
    {id:'paracosm', name:'Advance the Paracosm', tag:'primary', steps:[
      'Wire the STC Codex tab into the hub',
      'Stand up the Penultimate console',
      'Ship a Voracity beta build',
      'First beta tester playing',
      'Penultimate shell styled as cartoon / animation'
    ]},
    {id:'wildcard', name:'Wildcard — Fine Dining', tag:'wildcard', steps:[
      'Make compote in bulk',
      'Marble the compote into cheesecake',
      'Learn fine-dining presentation'
    ]}
  ];
  var REWARDS = [
    {id:'game', name:'Gaming night', cost:20},
    {id:'social', name:'Social outing', cost:25}
  ];
  var MILES = [
    {id:'serve1', name:'First $500 from the server business', bonus:75, unlock:'unlocks a weekend trip'},
    {id:'beta',   name:'Paracosm beta opens to testers',     bonus:50, unlock:'unlocks a celebration dinner'}
  ];

  function render(){
    var s = WM.get();
    document.getElementById('bal').textContent = WM.balance(s);

    // quests
    var qh = '';
    QUESTS.forEach(function(q){
      var arr = s.quests[q.id] || [];
      qh += '<div class="track"><h3>'+q.name+' <span class="q">· '+q.tag+'</span></h3>';
      q.steps.forEach(function(st, i){
        var done = arr[i] ? '1':'0';
        qh += '<div class="step" data-q="'+q.id+'" data-i="'+i+'" data-done="'+done+'">'+
              '<span class="box">'+(arr[i]?'✓':'')+'</span><span class="t">'+st+'</span>'+
              '<span class="r">+'+WM.STEP+'</span></div>';
      });
      qh += '</div>';
    });
    document.getElementById('quests').innerHTML = qh;

    // rewards
    var bal = WM.balance(s), rh = '';
    REWARDS.forEach(function(r){
      rh += '<div class="reward"><span class="t">'+r.name+'</span>'+
            '<span class="cost">'+r.cost+' ✦</span>'+
            '<button class="act" data-r="'+r.id+'" data-cost="'+r.cost+'"'+(bal<r.cost?' disabled':'')+'>Redeem</button></div>';
    });
    document.getElementById('rewards').innerHTML = rh;

    // milestones
    var mh = '';
    MILES.forEach(function(m){
      var hit = !!s.milestones[m.id];
      mh += '<div class="mile"><span class="t">'+m.name+'<small>+'+m.bonus+' ✦ · '+m.unlock+'</small></span>'+
            '<button class="act'+(hit?' on':'')+'" data-m="'+m.id+'" data-bonus="'+m.bonus+'">'+(hit?'Done ✓':'Mark hit')+'</button></div>';
    });
    document.getElementById('miles').innerHTML = mh;
  }

  document.addEventListener('click', function(e){
    var step = e.target.closest ? e.target.closest('.step') : null;
    if(step){
      var s = WM.get(), q = step.dataset.q, i = +step.dataset.i;
      s.quests[q] = s.quests[q] || [];
      s.quests[q][i] = !s.quests[q][i];
      WM.save(s); render(); return;
    }
    var rb = e.target.dataset && e.target.dataset.r;
    if(rb){ if(WM.spend(+e.target.dataset.cost)) render(); else { e.target.textContent='Not yet'; setTimeout(render, 900); } return; }
    var mb = e.target.dataset && e.target.dataset.m;
    if(mb){ var s2 = WM.get(); if(s2.milestones[mb]) delete s2.milestones[mb]; else s2.milestones[mb] = +e.target.dataset.bonus; WM.save(s2); render(); return; }
  });

  render();
</script>
</body>
</html>
